name: DEB Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example 0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deb-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.existing.outputs.build }}
    steps:
      - name: Skip an already published or staged release
        id: existing
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: process.env.RELEASE_TAG,
              });
              core.info(`Release already exists: ${release.data.html_url}. Leaving it unchanged.`);
              core.setOutput('build', 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('build', 'true');
            }

  release:
    needs: check-release
    if: needs.check-release.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Check version and toolchain
        run: |
          python3 - <<'PY'
          import os, plistlib, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v?[0-9]+\.[0-9]+\.[0-9]+(\+korboy[0-9]+)?', tag), 'expected a release version tag'
          with open('Resources/Info.plist', 'rb') as source:
              version = plistlib.load(source)['CFBundleShortVersionString']
          assert tag.removeprefix('v') == version, 'tag and Info.plist version differ'
          # Fork release notes include the complete current feature inventory.
          notes = Path(f'docs/releases/{version}.md')
          assert notes.is_file(), f'{notes} is missing'
          assert notes.read_text().strip(), f'{notes} is empty'
          PY
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk appletvos --show-sdk-version
          swift --version

      - name: Install packaging tools
        run: brew install ldid dpkg

      - name: Build and sign the CLI
        run: make all CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=

      # The iOS packages ship the probe agent and the icli flex runtime
      # (FLEX, the FlexUltra engine and reflection metadata) beside the CLI.
      - name: Build and sign the probe agent and the icli flex runtime
        run: make agent

      - name: Build and sign the tvOS CLI
        run: make tvos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=

      - name: Archive names in the C locale
        run: ./scripts/test-archive-locale.sh

      - name: Launchd plist paths and the RootHide rewrite
        run: ./scripts/test-launchd-plist-paths.sh

      - name: Passcode ledger for device passcode unlock
        run: ./scripts/test-passcode-ledger.sh

      - name: Foreground-uid lookup guard for tvOS
        run: ./scripts/test-foreground-uid.sh

      - name: Active interface geometry and scope isolation
        run: ./scripts/test-interface-geometry.sh

      - name: Background commands and interaction lease policy
        run: ./scripts/test-lease-policy.sh

      - name: RootHide root names and the root on disk
        run: ./scripts/test-roothide-root.sh

      - name: Unified log filters, the log stream and bounded crash reads
        run: ./scripts/test-syslog.sh

      - name: Probe bridge, prelude, output capture and api handler
        run: ./scripts/test-probe.sh

      - name: SHA-512 crypt known answers for account set-password
        run: ./scripts/test-sha512-crypt.sh

      - name: Fork audio outputs, verified actions and saved-passcode guards
        run: |
          ./scripts/test-audio-routes.sh
          ./scripts/test-verified-ui-actions.sh
          bash ./scripts/test-passcode-unlock.sh
          ./scripts/test-saved-passcode.sh

      - name: Build and verify the iOS and tvOS DEBs
        run: ./scripts/check-packages.sh

      - name: Prepare complete release assets and notes
        run: python3 scripts/prepare-release.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icli-debs-${{ env.RELEASE_TAG }}
          path: .build/publish-*/*
          if-no-files-found: error

      - name: Stage draft release for artifact validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creation fails if another publisher created this release during the build.
          # Never replace published assets or edit an existing release automatically.
          gh release create "$RELEASE_TAG" .build/publish-*/* --verify-tag --draft \
            --title "icli $RELEASE_TAG" --notes-file .build/release-notes.md
